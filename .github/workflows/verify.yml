name: Verify
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/breto@d3fc75c1542a41a85dda5c061692f393c67fbc35 # 2026.10.31181108
        with:
          registries: github:metio/toolchains
      - run: bb test
  reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/breto@d3fc75c1542a41a85dda5c061692f393c67fbc35 # 2026.10.31181108
        with:
          registries: github:metio/toolchains
      - run: reuse lint
  yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/breto@d3fc75c1542a41a85dda5c061692f393c67fbc35 # 2026.10.31181108
        with:
          registries: github:metio/toolchains
      - run: yamllint .
  github-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/breto@d3fc75c1542a41a85dda5c061692f393c67fbc35 # 2026.10.31181108
        with:
          registries: github:metio/toolchains
      - run: actionlint
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/breto@d3fc75c1542a41a85dda5c061692f393c67fbc35 # 2026.10.31181108
        with:
          registries: github:metio/toolchains
      - env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity low --format github .
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/breto@d3fc75c1542a41a85dda5c061692f393c67fbc35 # 2026.10.31181108
        with:
          registries: github:metio/toolchains
      - run: markdownlint-cli2 "**/*.md"
  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/breto@d3fc75c1542a41a85dda5c061692f393c67fbc35 # 2026.10.31181108
        with:
          registries: github:metio/toolchains
      - run: typos
  dco:
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: metio/ci/dco@1bcfd5d852697876af6c191fa597cf5aab22cb62 # 2026.10.31124002
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: metio/ci/policy-check@1bcfd5d852697876af6c191fa597cf5aab22cb62 # 2026.10.31124002
  verify:
    name: Verify
    needs: [test, reuse, yaml, github-actions, zizmor, markdown, typos, dco, policy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify every job succeeded or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          [ -z "$bad" ] || { echo "::error::$bad"; exit 1; }
