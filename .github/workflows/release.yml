name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write # cosign keyless sign-blob
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: gate
        uses: metio/ci/needs-release@1bcfd5d852697876af6c191fa597cf5aab22cb62 # 2026.10.31124002
        with:
          paths: src packages shell bb.edn breto action.yml .breto.edn README.md
      - uses: metio/breto@9fa67afc6a21b59600180acd0cee7d5eb26125ef # 2026.10.31164824
        if: steps.gate.outputs.needed == 'true'
        with:
          registries: github:metio/toolchains
      - name: Run the test suite before releasing
        if: steps.gate.outputs.needed == 'true'
        run: bb test
      - id: version
        if: steps.gate.outputs.needed == 'true'
        uses: metio/ci/calver@1bcfd5d852697876af6c191fa597cf5aab22cb62 # 2026.10.31124002
      - id: notes
        name: Generate release notes
        if: steps.gate.outputs.needed == 'true'
        uses: metio/ci/release-notes@1bcfd5d852697876af6c191fa597cf5aab22cb62 # 2026.10.31124002
        with:
          version: ${{ steps.version.outputs.version }}
          previous: ${{ steps.gate.outputs.last }}
      - name: Build the self-contained binaries
        if: steps.gate.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bb build
          bb_version=$(bb --version | sed 's/^babashka v//')
          mkdir dist bb
          for target in linux-amd64:linux-amd64-static linux-aarch64:linux-aarch64-static \
                        darwin-amd64:macos-amd64 darwin-aarch64:macos-aarch64; do
            tarball="babashka-${bb_version}-${target#*:}.tar.gz"
            gh release download "v${bb_version}" --repo babashka/babashka --dir bb \
              --pattern "${tarball}" --pattern "${tarball}.sha256"
            echo "$(cat "bb/${tarball}.sha256")  bb/${tarball}" | sha256sum --check
            tar --extract --gzip --file "bb/${tarball}" --directory bb bb
            cat bb/bb target/breto.jar > "dist/breto-${target%%:*}"
            rm bb/bb
          done
          chmod +x dist/breto-*
          (cd dist && sha256sum breto-* > "breto_${VERSION}_SHA256SUMS")
      - name: Sign the checksums
        if: steps.gate.outputs.needed == 'true'
        uses: metio/ci/cosign-sign-blob@1bcfd5d852697876af6c191fa597cf5aab22cb62 # 2026.10.31124002
        with:
          file: dist/breto_${{ steps.version.outputs.version }}_SHA256SUMS
      - name: Tag and publish the GitHub release
        if: steps.gate.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
          NOTES: ${{ steps.notes.outputs.file }}
        run: gh release create "$VERSION" --target "$SHA" --notes-file "$NOTES" --title "$VERSION" dist/*
